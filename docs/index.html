<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">
<title>Fabrizio Salmi</title>
<meta name="description" content="Fabrizio Salmi, infrastructure architect and engineer. Identity graph for AI agents.">
<link rel="alternate" type="text/markdown" href="identity.md">
<link rel="alternate" type="application/json" href="graph.json">
<link rel="describedby" href="llms.txt">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='4' fill='%23059669'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --fg: #0f1115;
    --muted: #5f6672;
    --line: #e4e6ea;
    --accent: #059669;
    --unit: 8px;
    --gutter: clamp(calc(var(--unit) * 3), 8vw, calc(var(--unit) * 16));
    font: 400 15px/24px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-kerning: normal;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0c0e;
      --fg: #e8e9ec;
      --muted: #8a909b;
      --line: #1d2025;
      --accent: #34d399;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: 1fr auto;
    padding:
      max(var(--gutter), env(safe-area-inset-top))
      max(var(--gutter), env(safe-area-inset-right))
      max(calc(var(--unit) * 4), env(safe-area-inset-bottom))
      max(var(--gutter), env(safe-area-inset-left));
    background: var(--bg);
    color: var(--fg);
  }
  ::selection { background: var(--fg); color: var(--bg); }
  main { align-self: center; max-width: 34rem; padding-bottom: calc(var(--unit) * 4); }
  h1 {
    font-size: 22px;
    line-height: 32px;
    font-weight: 500;
    letter-spacing: -0.011em;
  }
  p {
    margin-top: calc(var(--unit) * 1);
    color: var(--muted);
    text-wrap: balance;
  }
  nav {
    display: flex;
    flex-wrap: wrap;
    gap: calc(var(--unit) * 1) calc(var(--unit) * 3);
    margin-top: calc(var(--unit) * 5);
    font: 400 13px/24px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    transition: border-color 120ms ease;
  }
  a:hover { border-color: currentColor; }
  a:focus-visible { outline: 1px solid var(--fg); outline-offset: 4px; border-color: transparent; }
  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: calc(var(--unit) * 1) calc(var(--unit) * 3);
    padding-top: calc(var(--unit) * 2);
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
    line-height: 24px;
    font-variant-numeric: tabular-nums;
  }
  .asks { display: inline-flex; align-items: center; gap: var(--unit); color: var(--fg); }
  .asks::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .end { margin-left: auto; }
  @media (max-width: 559px) {
    nav { display: grid; grid-template-columns: repeat(2, max-content); justify-content: start; justify-items: start; }
  }
  @media (max-width: 399px) {
    .label { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Fabrizio Salmi</h1>
  <p>Infrastructure architect and engineer. Autonomy through code.</p>
  <nav aria-label="For agents">
    <a href="llms.txt">llms.txt</a>
    <a href="identity.md">identity.md</a>
    <a href="graph.json">graph.json</a>
    <a href="asks.json">asks.json</a>
  </nav>
</main>
<footer>
  <a class="asks" href="asks.json">9 open asks</a>
  <span><span class="label">updated </span>2026-10-15</span>
  <a class="end" href="https://github.com/fabriziosalmi">github</a>
</footer>
</body>
</html>
